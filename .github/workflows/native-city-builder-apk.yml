name: Build Native City Builder APK

on:
  push:
    branches:
      - city-builder-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct project archive
        shell: bash
        run: |
          cat parts/part-* | tr -d '\n\r' | base64 -d > NativeCityBuilder_MVP_0_2.zip
          unzip -t NativeCityBuilder_MVP_0_2.zip
          rm -rf build-work
          mkdir build-work
          unzip -q NativeCityBuilder_MVP_0_2.zip -d build-work

      - name: Build debug APK
        working-directory: build-work/NativeCityBuilder
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeCityBuilder-MVP-0.2-APK
          path: build-work/NativeCityBuilder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
