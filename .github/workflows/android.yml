name: Build Android APK
# Re-run full menu preview validation after the UI test type fix.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'integration/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install pinned Android NDK
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"'

      - name: Build official offline Stockfish and corresponding source
        run: tools/build_stockfish.sh

      - name: Package exact PixelChess corresponding source
        run: tools/package_pixelchess_source.sh

      - name: Configure release signing when repository secrets are available
        env:
          KEYSTORE_BASE64: ${{ secrets.PIXELCHESS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PIXELCHESS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXELCHESS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIXELCHESS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixelchess-release.jks"
            echo "PIXELCHESS_KEYSTORE_PATH=$RUNNER_TEMP/pixelchess-release.jks" >> "$GITHUB_ENV"
            echo "PIXELCHESS_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PIXELCHESS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PIXELCHESS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing secrets configured."
          else
            echo "Release signing secrets unavailable; building unsigned release packages."
          fi

      - name: Verify approved Forest assets
        run: python3 tools/verify_forest_assets.py

      - name: Verify board asset layout
        run: gradle :app:testDebugUnitTest

      - name: Android static analysis
        run: gradle :app:lintDebug

      - name: Build debug and release packages
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Capture themed menu screens on Android 35
        run: tools/capture_royal_menu_previews.py

      - name: Verify packaged Stockfish on Android 35
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/pixelchess-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;default;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pixelchess35 -k 'system-images;android-35;default;x86_64' --device pixel_2
          tools/verify_android_stockfish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-Royal-Library-menu-previews
          path: build/royal-menu-previews/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-0.27.1-release-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-0.27.1-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Stockfish-19-corresponding-source
          path: build/stockfish-distribution/*

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-corresponding-source
          path: build/pixelchess-distribution/*
