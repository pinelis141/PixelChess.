name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, feature/forest-skin-test, feature/forest-theme-foundation, refactor/theme-system, feature/castle-medieval, feature/volcanic-forge, integration/themes-stable, feature/theme-selector ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify approved Forest assets
        run: python3 tools/verify_forest_assets.py

      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PixelChess-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

