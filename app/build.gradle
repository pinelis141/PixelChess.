plugins { id 'com.android.application' }
android { namespace 'com.pixelchess.app'; compileSdk 35
 defaultConfig { applicationId 'com.pixelchess.app'; minSdk 26; targetSdk 35; versionCode 22; versionName '0.19.2' }
 buildFeatures { buildConfig true }
 testOptions { unitTests.all { testLogging.showStandardStreams = true } }
}

dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}

